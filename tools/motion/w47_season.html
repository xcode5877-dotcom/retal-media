<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="w47_common.css">
<style>
.stepno{position:absolute;left:50%;top:330px;width:260px;height:260px;margin-left:-130px;border-radius:50%;background:var(--gold);color:var(--plumd);
  display:flex;align-items:center;justify-content:center;font-size:170px;font-weight:800;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.ring{position:absolute;left:50%;top:300px;width:320px;height:320px;margin-left:-160px;border-radius:50%;border:5px solid rgba(210,175,110,.5)}
.slabel{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:44px;font-weight:600;color:var(--blush)}
.title{position:absolute;left:40px;right:40px;top:720px;text-align:center;font-size:110px;font-weight:800;line-height:1.25;white-space:nowrap}
.desc{position:absolute;left:110px;right:110px;top:1010px;text-align:center;font-size:58px;font-weight:600;line-height:1.5;color:var(--ivory);
  background:rgba(250,244,228,.08);border:3px solid rgba(210,175,110,.45);border-radius:40px;padding:50px 40px}
.cal{position:absolute;left:50%;top:420px;width:300px;height:290px;margin-left:-150px}
</style></head><body>
<div id="stage"><div class="grid" id="grid"></div><div id="cam">
  <div class="layer" id="hook">
    <div class="glow" id="hglow"></div>
    <div class="line sb blush" id="h0" style="top:470px;font-size:70px"><span class="w">قبل</span> <span class="w">ما</span> <span class="w">يبلش</span></div>
    <div class="line xb gold" id="h1" style="top:590px;font-size:118px"><span class="w">موسم</span> <span class="w">العروض</span></div>
    <div class="line xb" id="h2" style="top:860px;font-size:104px"><span class="w">جهّز</span> <span class="w">تغليفك</span></div>
    <div class="line xb" id="h3" style="top:1000px;font-size:104px"><span class="w">بـ3</span> <span class="w">خطوات</span></div>
  </div>
  <div class="layer st" id="s1" style="visibility:hidden"><div class="slabel">الخطوة</div><div class="ring"></div><div class="stepno">1</div>
    <div class="title"><span class="w">اطلب</span> <span class="w">بكّير</span></div>
    <div class="desc">لا تستنى الضغط،<br>جهّز كمية تكفيك من هلأ</div></div>
  <div class="layer st" id="s2" style="visibility:hidden"><div class="slabel">الخطوة</div><div class="ring"></div><div class="stepno">2</div>
    <div class="title" style="font-size:80px"><span class="w">هوية</span> <span class="w">وحدة</span> <span class="w">لكل</span> <span class="w">القطع</span></div>
    <div class="desc">الكرتونة والكيس والكرت<br>بنفس ألوان محلك</div></div>
  <div class="layer st" id="s3" style="visibility:hidden"><div class="slabel">الخطوة</div><div class="ring"></div><div class="stepno">3</div>
    <div class="title" style="font-size:100px"><span class="w">كرت</span> <span class="w">جوّا</span> <span class="w">كل</span> <span class="w">طلب</span></div>
    <div class="desc">عليه عرض أو كود خصم<br>عشان الزبون يرجعلك</div></div>
  <div class="layer" id="end" style="visibility:hidden">
    <div class="glow" style="top:200px"></div>
    <div class="plate" id="plate"><img src="../../logo.png"></div>
    <div class="line xb" id="e1" style="top:770px;font-size:96px"><span class="w">خلّي</span> <span class="w">الموسم</span></div>
    <div class="line xb gold" id="e2" style="top:900px;font-size:96px"><span class="w">يلبس</span> <span class="w">شعارك</span></div>
    <div class="pill" id="pill">راسلنا على واتساب</div>
    <div class="line md blush" id="e3" style="top:1350px;font-size:50px">أقل طلب 500 قطعة</div>
  </div>
  <div id="flash"></div>
</div>
<div id="progbg"></div><div id="prog"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="w47_common.js"></script>
<script>
const D = 15.0; base(D);
tl.fromTo('#hglow',{scale:0.6,opacity:0},{scale:1.1,opacity:1,duration:0.8},0);
words('#h0',0.02,0.12);
tl.from('#h1 .w',{scale:3,opacity:0,filter:'blur(40px)',duration:0.35,ease:'expo.out',stagger:0.15},0.4); shake(0.75,1.3); flash(0.73,0.5);
words('#h2',1.15,0.13); words('#h3',1.5,0.13); shake(1.75,0.6);
leave('#hook',2.5,'x');
const hw=['x','z','y'];
[1,2,3].forEach((i,k)=>{
  const t=2.75+k*3.2, s='#s'+i; enter(s,t,hw[k]); flash(t+0.04,0.5);
  tl.from(s+' .slabel',{opacity:0,y:-30,duration:0.3},t+0.1);
  tl.from(s+' .stepno',{scale:0,rotation:-200,duration:0.5,ease:'back.out(2.5)'},t+0.12); shake(t+0.5,0.9);
  tl.from(s+' .ring',{scale:0.4,opacity:0,duration:0.6,ease:'expo.out'},t+0.4);
  tl.to(s+' .ring',{scale:1.25,opacity:0,duration:1.2,ease:'power1.out'},t+1.0);
  words(s+' .title',t+0.55,0.12,0.4);
  tl.from(s+' .desc',{y:250,opacity:0,filter:'blur(16px)',duration:0.45,ease:'back.out(1.5)'},t+1.15);
  leave(s,t+2.95,k===1?'x':'z');
});
endCard(12.5);
finish();
</script></body></html>
